<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전인교육원 교양과목 히스토리</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f7f7f5;--bg3:#f0f0ec;
  --text:#1a1a1a;--text2:#555550;--text3:#999990;
  --border:#e0e0d8;--border2:#c8c8c0;
  --blue:#1a5fa8;--blue-bg:#e8f0fb;
  --green:#1a7a4a;--green-bg:#e6f5ee;--green-text:#1a7a4a;
  --red:#c0392b;--red-bg:#fcecea;--red-text:#c0392b;
  --amber:#a06010;--amber-bg:#fef6e4;--amber-text:#a06010;
  --purple:#6b3fa0;--purple-bg:#f0eafa;--purple-text:#6b3fa0;
  --teal:#0e7490;--teal-bg:#e0f7fa;--teal-text:#0e4c6e;
  --radius:8px;--radius-lg:12px;
}
body{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:var(--bg2);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
.top-bar{background:var(--bg);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.top-bar .logo{font-size:15px;font-weight:700;color:var(--text)}
.top-bar .logo span{color:var(--blue)}
.top-bar .meta{font-size:12px;color:var(--text3)}
.container{max-width:1400px;margin:0 auto;padding:1.5rem 2rem}
.page-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px;letter-spacing:-.5px}
.page-sub{font-size:13px;color:var(--text2);margin-bottom:1.5rem}

/* 통계 카드 - 4개만 */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.s-label{font-size:11px;color:var(--text3);margin-bottom:6px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.s-value{font-size:28px;font-weight:700;color:var(--text);line-height:1}
.s-sub{font-size:11px;color:var(--text3);margin-top:5px}
.s-active .s-value{color:var(--green)}.s-abolished .s-value{color:var(--red)}.s-changed .s-value{color:var(--amber)}

/* 차트 */
.charts-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem}
.chart-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.chart-card h3{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.2px}
.bar-list{display:flex;flex-direction:column;gap:5px;max-height:300px;overflow-y:auto}
.bar-row{display:flex;align-items:center;gap:8px;font-size:11px}
.bar-lbl{width:36px;color:var(--text3);text-align:right;flex-shrink:0}
.bar-track{flex:1;background:var(--bg3);border-radius:3px;height:14px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px}
.bar-fill.blue{background:#2563eb}.bar-fill.green{background:#16a34a}.bar-fill.purple{background:#7c3aed}
.bar-val{width:44px;color:var(--text2);font-weight:500;flex-shrink:0;font-size:11px;text-align:right}

/* 메인 패널 */
.main-panel{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:0 1px 3px rgba(0,0,0,.04);overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 1rem;background:var(--bg);overflow-x:auto}
.tab-btn{font-size:13px;font-weight:500;padding:12px 14px;cursor:pointer;color:var(--text3);border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;white-space:nowrap;flex-shrink:0}
.tab-btn:hover{color:var(--text)}.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue)}
.tab-count{display:inline-block;font-size:11px;background:var(--bg3);color:var(--text3);border-radius:20px;padding:1px 7px;margin-left:4px}
.tab-btn.active .tab-count{background:var(--blue-bg);color:var(--blue)}

/* 필터/검색 */
.controls{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg2);flex-wrap:wrap;align-items:center}
.search-wrap{position:relative;flex:1;min-width:180px}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);width:15px;height:15px}
#searchInput{width:100%;padding:8px 10px 8px 32px;font-size:13px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);outline:none}
#searchInput:focus{border-color:var(--blue)}
.ctrl-select{padding:7px 10px;font-size:13px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);cursor:pointer;outline:none;min-width:100px}
.ctrl-select:focus{border-color:var(--blue)}
.filter-label{font-size:11px;font-weight:600;color:var(--text3);white-space:nowrap;align-self:center}
.result-info{font-size:12px;color:var(--text3);white-space:nowrap;align-self:center;margin-left:auto}

/* 테이블 */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1000px}
thead th{background:var(--bg2);font-size:11px;font-weight:700;color:var(--text3);padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;letter-spacing:.3px;text-transform:uppercase}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--blue-bg)}
tbody tr.selected{background:#dbeafe}
tbody td{padding:9px 12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.code-cell{font-family:'SF Mono','Fira Code',monospace;font-size:12px;color:var(--blue);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.name-cell{font-weight:500;cursor:pointer}
.name-cell:hover{color:var(--blue);text-decoration:underline}
.num-cell{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.badge{display:inline-flex;align-items:center;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
.badge-active{background:var(--green-bg);color:var(--green-text)}
.badge-abolished{background:var(--red-bg);color:var(--red-text)}
.badge-other{background:var(--bg3);color:var(--text3)}
.badge-changed{background:var(--amber-bg);color:var(--amber-text)}
.has-desc{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--purple);margin-left:5px;vertical-align:middle}

/* 상세 드로어 */
.detail-drawer{border-top:2px solid var(--blue);max-height:0;overflow:hidden;transition:max-height .35s ease,padding .35s ease;background:var(--bg)}
.detail-drawer.open{max-height:700px;padding:20px 22px 26px}
.detail-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.detail-code{font-family:'SF Mono','Fira Code',monospace;font-size:13px;color:var(--blue);font-weight:600;margin-bottom:3px}
.detail-name{font-size:20px;font-weight:700;color:var(--text);letter-spacing:-.4px}
.detail-eng{font-size:12px;color:var(--text3);margin-top:2px}
.close-btn{background:var(--bg3);border:none;cursor:pointer;color:var(--text2);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.close-btn:hover{background:var(--border2)}
.detail-meta{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-bottom:14px}
.meta-item label{font-size:10px;font-weight:700;color:var(--text3);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px}
.meta-item .mv{font-size:13px;color:var(--text);font-weight:700}
.mv.blue{color:var(--blue)}.mv.green{color:var(--green)}.mv.red{color:var(--red)}.mv.purple{color:var(--purple)}.mv.teal{color:var(--teal)}
.diff-notice{background:var(--teal-bg);border-left:3px solid var(--teal);border-radius:var(--radius);padding:10px 13px;margin-bottom:14px;font-size:12px;color:var(--teal-text)}
.name-hist-box{background:var(--amber-bg);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;border-left:3px solid var(--amber)}
.name-hist-title{font-size:11px;font-weight:700;color:var(--amber-text);margin-bottom:8px;text-transform:uppercase;letter-spacing:.3px}
.name-hist-item{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text2);padding:3px 0}
.nh-sem{font-size:11px;color:var(--text3);min-width:90px;font-family:'SF Mono','Fira Code',monospace}

/* 수강인원 추이 차트 */
.trend-section{margin-top:2px}
.trend-title{font-size:11px;font-weight:700;color:var(--text3);margin-bottom:8px;text-transform:uppercase;letter-spacing:.3px}
.enroll-bars{display:flex;align-items:flex-end;gap:3px;height:80px}
.enroll-bar{flex:1;min-width:8px;border-radius:3px 3px 0 0;background:var(--green);opacity:.65;transition:opacity .1s;cursor:default;position:relative}
.enroll-bar:hover{opacity:1}
.enroll-bar-tip{display:none;position:absolute;bottom:calc(100%+5px);left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;font-size:10px;padding:4px 7px;border-radius:5px;white-space:nowrap;z-index:10;pointer-events:none;line-height:1.6}
.enroll-bar:hover .enroll-bar-tip{display:block}
.trend-xlabels{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-top:3px}

/* 코드변경 박스 */
.code-change-box{background:var(--teal-bg);border-left:3px solid var(--teal);border-radius:var(--radius);padding:10px 13px;margin-bottom:14px;font-size:12px;color:var(--teal-text)}

/* 모달 */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg);border-radius:var(--radius-lg);max-width:660px;width:90%;max-height:82vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.18);padding:26px 28px;position:relative}
.modal-close{position:absolute;top:14px;right:14px;background:var(--bg3);border:none;cursor:pointer;color:var(--text2);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px}
.modal-close:hover{background:var(--border2)}
.modal-code{font-family:'SF Mono','Fira Code',monospace;font-size:12px;color:var(--blue);font-weight:600;margin-bottom:4px}
.modal-name{font-size:20px;font-weight:700;color:var(--text);margin-bottom:2px;letter-spacing:-.4px}
.modal-eng{font-size:12px;color:var(--text3);margin-bottom:16px}
.modal-desc{font-size:14px;color:var(--text2);line-height:1.8;white-space:pre-wrap}
.modal-no-desc{font-size:13px;color:var(--text3);font-style:italic;margin-top:16px}
.modal-tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;margin-right:6px;margin-bottom:10px;font-weight:600}

/* 페이지네이션 */
.pagination{display:flex;gap:4px;justify-content:flex-end;align-items:center;padding:12px 16px;border-top:1px solid var(--border);background:var(--bg2)}
.pg-btn{font-size:12px;padding:5px 10px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);cursor:pointer;color:var(--text2);min-width:32px;text-align:center}
.pg-btn:hover:not(:disabled){background:var(--bg3);border-color:var(--blue);color:var(--blue)}
.pg-btn:disabled{opacity:.35;cursor:default}
.pg-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
.pg-info{font-size:12px;color:var(--text3);margin-right:4px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px}

@media(max-width:1100px){.stats-grid{grid-template-columns:repeat(2,1fr)}.charts-row{grid-template-columns:1fr 1fr}.detail-meta{grid-template-columns:repeat(4,1fr)}}
@media(max-width:768px){.stats-grid{grid-template-columns:repeat(2,1fr)}.charts-row{grid-template-columns:1fr}.container{padding:1rem}.top-bar{padding:0 1rem}}
</style>
</head>

        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="detail-drawer" id="detailDrawer"></div>
    <div class="pagination" id="pagination"></div>
  </div>
</div>

const COURSES=DATA.courses,STATS=DATA.stats,YDIV=DATA.yearlyDivisions,YCRS=DATA.yearlyCourses,YENR=DATA.yearlyEnrollment;
const PAGE_SIZE=20;
let tab='all',search='',sort='code',page=1,selectedCode=null;
let fCategory='',fArea='',fDept='',fTerm='';

const TABS=[
  {id:'all',label:'전체'},
  {id:'active',label:'현행'},
  {id:'abolished',label:'폐지'},
  {id:'changed',label:'과목명 변경'},
  {id:'codeChanged',label:'코드변경'},
  {id:'unregistered',label:'마스터 미등록'},
];

function semKey(s){if(!s)return 0;const p=s.split(' ');return parseInt(p[0])*10+({'1학기':1,'2학기':2,'하계':3,'동계':4}[p[1]]||0);}
function isDiff(c){return c.shinSem&&c.firstSem&&semKey(c.shinSem)!==semKey(c.firstSem)&&semKey(c.shinSem)<semKey(c.firstSem);}
function fmt(n){return Number(n).toLocaleString('ko-KR');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function badge(s){
  if(s==='현행') return '<span class="badge badge-active">현행</span>';
  if(s==='폐지') return '<span class="badge badge-abolished">폐지</span>';
  return '<span class="badge badge-other">'+s.replace('마스터미등록','미등록')+'</span>';
}

// 필터 옵션 초기화
function initFilters(){
  const cats=[...new Set(COURSES.map(c=>c.category).filter(Boolean))].sort();
  const areas=[...new Set(COURSES.map(c=>c.area).filter(v=>v&&v!=='0'))].sort();
  const depts=[...new Set(COURSES.map(c=>c.dept).filter(Boolean))].sort();
  const terms=[...new Set(COURSES.map(c=>c.openTerm).filter(Boolean))].sort();

  const addOpts=(id,vals)=>{
    const el=document.getElementById(id);
    vals.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o);});
  };
  addOpts('filterCategory',cats);
  addOpts('filterArea',areas);
  addOpts('filterDept',depts);
  addOpts('filterTerm',terms);
}

function getFiltered(){
  let list=COURSES;
  if(tab==='active') list=list.filter(c=>c.status==='현행');
  else if(tab==='abolished') list=list.filter(c=>c.status==='폐지');
  else if(tab==='changed') list=list.filter(c=>c.nameChanged);
  else if(tab==='codeChanged') list=list.filter(c=>c.oldCode||c.codeChangeNote.startsWith('→'));
  else if(tab==='unregistered') list=list.filter(c=>c.status.includes('마스터미등록'));

  if(fCategory) list=list.filter(c=>c.category===fCategory);
  if(fArea) list=list.filter(c=>c.area===fArea);
  if(fDept) list=list.filter(c=>c.dept===fDept);
  if(fTerm) list=list.filter(c=>c.openTerm===fTerm);

  if(search){
    const q=search.toLowerCase();
    list=list.filter(c=>c.code.toLowerCase().includes(q)||c.name.includes(search)||(c.engName&&c.engName.toLowerCase().includes(q)));
  }
  return [...list].sort((a,b)=>{
    if(sort==='code') return a.code.localeCompare(b.code);
    if(sort==='openDesc') return b.openCount-a.openCount;
    if(sort==='openAsc') return a.openCount-b.openCount;
    if(sort==='avgEnrollDesc') return b.avgEnrollPerSem-a.avgEnrollPerSem;
    if(sort==='firstAsc') return a.firstSem.localeCompare(b.firstSem);
    if(sort==='lastDesc') return b.lastSem.localeCompare(a.lastSem);
    return 0;
  });
}

function closeModal(){document.getElementById('descModal').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function renderStats(){
  const s=STATS;
  document.getElementById('statsGrid').innerHTML=`
    <div class="stat-card"><div class="s-label">총 과목 수</div><div class="s-value">${fmt(s.totalCourses)}</div><div class="s-sub">개설이력 기준 (2007–2026)</div></div>
    <div class="stat-card s-active"><div class="s-label">현행 과목</div><div class="s-value">${fmt(s.activeCourses)}</div><div class="s-sub">마스터 전체 ${fmt(s.masterTotalActive)}개</div></div>
    <div class="stat-card s-abolished"><div class="s-label">폐지 과목</div><div class="s-value">${fmt(s.abolishedCourses)}</div><div class="s-sub">마스터 전체 ${fmt(s.masterTotalAbolished)}개</div></div>
    <div class="stat-card s-changed"><div class="s-label">명칭 변경</div><div class="s-value">${fmt(s.nameChangedCourses)}</div><div class="s-sub">개설이력 과목 중</div></div>
  `;
}

function renderCharts(){
  const yrs=Object.keys(YDIV).filter(y=>y!=='2007').sort();
  const maxD=Math.max(...yrs.map(y=>YDIV[y]));
  const maxC=Math.max(...yrs.map(y=>YCRS[y]));
  const maxE=Math.max(...yrs.map(y=>YENR[y]||0));
  const mk=(yrs,data,max,cls)=>yrs.map(y=>`<div class="bar-row"><div class="bar-lbl">${y}</div><div class="bar-track"><div class="bar-fill ${cls}" style="width:${Math.round((data[y]||0)/max*100)}%"></div></div><div class="bar-val">${fmt(data[y]||0)}</div></div>`).join('');
  document.getElementById('chartsRow').innerHTML=`
    <div class="chart-card"><h3>📊 연도별 총 분반 수</h3><div class="bar-list">${mk(yrs,YDIV,maxD,'blue')}</div></div>
    <div class="chart-card"><h3>📚 연도별 개설 과목 수</h3><div class="bar-list">${mk(yrs,YCRS,maxC,'green')}</div></div>
    <div class="chart-card"><h3>👥 연도별 총 수강인원</h3><div class="bar-list">${mk(yrs,YENR,maxE,'purple')}</div></div>
  `;
}

function renderTabs(){
  const cnt={
    all:COURSES.length,
    active:COURSES.filter(c=>c.status==='현행').length,
    abolished:COURSES.filter(c=>c.status==='폐지').length,
    changed:COURSES.filter(c=>c.nameChanged).length,
    codeChanged:COURSES.filter(c=>c.oldCode||c.codeChangeNote.startsWith('→')).length,
    unregistered:COURSES.filter(c=>c.status.includes('마스터미등록')).length,
  };
  document.getElementById('tabBar').innerHTML=TABS.map(t=>
    `<button class="tab-btn ${tab===t.id?'active':''}" onclick="switchTab('${t.id}')">${t.label}<span class="tab-count">${cnt[t.id]}</span></button>`
  ).join('');
}

function renderTable(){
  const filtered=getFiltered();
  const total=filtered.length,totalPages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(page>totalPages) page=1;
  const rows=filtered.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);
  document.getElementById('resultInfo').textContent=`${fmt(total)}개 과목`;

  const tbody=document.getElementById('tableBody');
  if(!rows.length){tbody.innerHTML='<tr><td colspan="13"><div class="empty-state">검색 결과가 없습니다.</div></td></tr>';renderPagination(0);return;}

  tbody.innerHTML=rows.map(c=>{
    const hasDiff=isDiff(c);
    const hasCatalog=!!c.catalogDesc;
    const descDot=hasCatalog?'<span class="has-desc" title="요람 설명 있음"></span>':'';
    const codeCell=`<span class="code-cell">${c.code}${descDot}</span>`;
    const nameCell=`<span class="name-cell" title="${c.name}">${c.name}</span>`;
    const shinCell=c.shinSem?(hasDiff?`<span style="color:var(--teal-text);font-weight:600">${c.shinSem}</span>`:c.shinSem):'—';
    const firstCell=hasDiff?`<span style="color:var(--teal-text);font-weight:600">${c.firstSem}</span>`:c.firstSem;
    return `<tr onclick="toggleDetail('${c.code}')" class="${selectedCode===c.code?'selected':''}">
      <td>${codeCell}</td>
      <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis">${nameCell}</td>
      <td style="font-size:12px">${c.category||'<span style="color:var(--text3)">—</span>'}</td>
      <td style="font-size:12px;max-width:145px;overflow:hidden;text-overflow:ellipsis" title="${c.area}">${c.area&&c.area!=='0'?c.area:'<span style="color:var(--text3)">—</span>'}</td>
      <td style="font-size:12px;max-width:110px;overflow:hidden;text-overflow:ellipsis" title="${c.dept}">${c.dept||'<span style="color:var(--text3)">—</span>'}</td>
      <td style="font-size:12px;text-align:center">${c.openTerm||'<span style="color:var(--text3)">—</span>'}</td>
      <td style="font-size:12px">${shinCell}</td>
      <td style="font-size:12px">${firstCell}</td>
      <td style="font-size:12px">${c.lastSem}</td>
      <td class="num-cell">${c.openCount}회</td>
      <td class="num-cell">${fmt(c.avgEnrollPerSem)}명</td>
      <td style="text-align:center">${badge(c.status)}</td>
      <td style="text-align:center">${c.nameChanged?'<span class="badge badge-changed">변경</span>':'<span style="color:var(--text3);font-size:12px">—</span>'}</td>
    </tr>`;
  }).join('');
  renderPagination(totalPages);
}

function renderPagination(totalPages){
  const el=document.getElementById('pagination');
  if(totalPages<=1){el.innerHTML='';return;}
  let h=`<span class="pg-info">${page}/${totalPages} 페이지</span>`;
  h+=`<button class="pg-btn" onclick="goPage(1)" ${page===1?'disabled':''}>«</button>`;
  h+=`<button class="pg-btn" onclick="goPage(${page-1})" ${page===1?'disabled':''}>‹</button>`;
  const s=Math.max(1,page-2),e=Math.min(totalPages,page+2);
  for(let i=s;i<=e;i++) h+=`<button class="pg-btn ${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`;
  h+=`<button class="pg-btn" onclick="goPage(${page+1})" ${page===totalPages?'disabled':''}>›</button>`;
  h+=`<button class="pg-btn" onclick="goPage(${totalPages})" ${page===totalPages?'disabled':''}>»</button>`;
  el.innerHTML=h;
}

function goPage(p){page=p;renderTable();document.querySelector('.main-panel').scrollIntoView({behavior:'smooth',block:'start'});}

function toggleDetail(code){
  if(selectedCode===code){closeDetail();return;}
  selectedCode=code;
  const c=COURSES.find(x=>x.code===code);if(!c) return;

  // 연도별 수강인원 추이 차트
  const yrs=Object.keys(c.yearlyEnrollment).sort();
  const maxE=Math.max(...Object.values(c.yearlyEnrollment),1);
  const bars=yrs.map(y=>{
    const h=Math.max(4,Math.round((c.yearlyEnrollment[y]/maxE)*72));
    return `<div class="enroll-bar" style="height:${h}px"><div class="enroll-bar-tip">${y}년<br>수강 ${fmt(c.yearlyEnrollment[y])}명<br>분반 ${c.yearlyDivisions[y]||0}개</div></div>`;
  }).join('');

  const hasDiff=isDiff(c);
  const diffNotice=hasDiff?`<div class="diff-notice"><strong>신설학기 ≠ 최초개설학기</strong> &nbsp;|&nbsp; 신설: ${c.shinSem} &nbsp;→&nbsp; 첫 개설: ${c.firstSem}</div>`:'';
  const nameHistHtml=c.nameHistory.length>1?`
    <div class="name-hist-box">
      <div class="name-hist-title">⚠ 과목명 변경 이력</div>
      ${c.nameHistory.map((h,i)=>`<div class="name-hist-item">${i>0?'<span style="color:var(--amber-text)">→</span>':'<span style="opacity:.3">·</span>'}<span class="nh-sem">${h['학기']}</span><span>${h['과목명']}</span></div>`).join('')}
    </div>`:'';
  const codeChangeHtml=(c.oldCode||c.codeChangeNote.startsWith('→'))?`
    <div class="code-change-box"><strong>🔄 코드변경 이력</strong><br>
    ${c.oldCode?`구코드: <code style="background:#b2ebf2;padding:1px 5px;border-radius:3px">${c.oldCode}</code>${c.codeChangedAt?' ('+c.codeChangedAt+')':''}<br>`:''}
    ${c.codeChangeNote}</div>`:'';

  const drawer=document.getElementById('detailDrawer');
  drawer.innerHTML=`
    <div class="detail-top">
      <div>
        <div class="detail-code">${c.code}</div>
        <div class="detail-name">${c.name}</div>
        <div class="detail-eng">${c.engName||''}</div>
      </div>
      <button class="close-btn" onclick="closeDetail()">✕</button>
    </div>
    ${diffNotice}
    <div class="detail-meta">
      <div class="meta-item"><label>과목상태</label>${badge(c.status)}</div>
      <div class="meta-item"><label>이수구분</label><span class="mv">${c.category||'—'}</span></div>
      <div class="meta-item"><label>세부영역</label><span class="mv" style="font-size:12px">${c.area&&c.area!=='0'?c.area:'—'}</span></div>
      <div class="meta-item"><label>주관부서</label><span class="mv" style="font-size:12px">${c.dept||'—'}</span></div>
      <div class="meta-item"><label>개설시기</label><span class="mv blue">${c.openTerm||'—'}</span></div>
      <div class="meta-item"><label>신설학기</label><span class="mv${hasDiff?' teal':''}">${c.shinSem||'—'}</span></div>
      <div class="meta-item"><label>최초개설</label><span class="mv${hasDiff?' teal':''}">${c.firstSem}</span></div>
      <div class="meta-item"><label>마지막개설</label><span class="mv">${c.lastSem}</span></div>
      <div class="meta-item"><label>개설횟수</label><span class="mv">${c.openCount}회</span></div>
      <div class="meta-item"><label>평균분반</label><span class="mv blue">${c.avgDivPerSem}개</span></div>
      <div class="meta-item"><label>평균수강인원</label><span class="mv green">${fmt(c.avgEnrollPerSem)}명</span></div>
      <div class="meta-item"><label>분반당평균</label><span class="mv purple">${c.avgEnrollPerDiv}명</span></div>
      ${c.abolishedSem?`<div class="meta-item"><label>폐지학기</label><span class="mv red">${c.abolishedSem}</span></div>`:''}
    </div>
    ${nameHistHtml}
    ${codeChangeHtml}
    ${c.catalogDesc?`
    <div style="background:var(--purple-bg);border-left:3px solid var(--purple);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;color:var(--purple-text);text-transform:uppercase;letter-spacing:.3px;margin-bottom:8px">📖 요람 과목 설명</div>
      <div style="font-size:13px;color:var(--text2);line-height:1.8;white-space:pre-wrap">${esc(c.catalogDesc)}</div>
    </div>`:''}
    <div class="trend-section">
      <div class="trend-title">연도별 수강인원 추이</div>
      <div class="enroll-bars">${bars}</div>
      <div class="trend-xlabels"><span>${yrs[0]}</span><span>${yrs[Math.floor(yrs.length/2)]||''}</span><span>${yrs[yrs.length-1]}</span></div>
    </div>
  `;
  drawer.classList.add('open');
  renderTable();
  setTimeout(()=>drawer.scrollIntoView({behavior:'smooth',block:'nearest'}),120);
}

function closeDetail(){selectedCode=null;document.getElementById('detailDrawer').classList.remove('open');renderTable();}
function switchTab(t){tab=t;page=1;selectedCode=null;document.getElementById('detailDrawer').classList.remove('open');renderTabs();renderTable();}
function onSearch(){search=document.getElementById('searchInput').value;page=1;selectedCode=null;renderTable();}
function onSort(){sort=document.getElementById('sortSelect').value;page=1;renderTable();}
function onFilter(){
  fCategory=document.getElementById('filterCategory').value;
  fArea=document.getElementById('filterArea').value;
  fDept=document.getElementById('filterDept').value;
  fTerm=document.getElementById('filterTerm').value;
  page=1;selectedCode=null;renderTable();
}

renderStats();renderCharts();initFilters();renderTabs();renderTable();
</script>
</body>
</html>
